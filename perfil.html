<body>

<div class="container">

    <aside class="sidebar" id="sidebar">
        <div>
            <div class="toggle-btn" onclick="toggleMenu()">☰</div>
            <button class="btn-tema" onclick="alternarTema()">
                🌙
            </button>

            <div class="logo">
                <span class="logo-text">💅NailManager</span>
            </div>

            <nav>
                <ul>
                    <li><a href="dashboard.html">🏠 <span class="menu-text">Dashboard</span></a></li>
                    <li><a href="agenda.html">📅 <span class="menu-text">Agenda</span></a></li>
                    <li><a href="index.html">👤 <span class="menu-text">Clientes</span></a></li>

            <div class="dados-perfil">
                <div>
                    <strong>ID da conta</strong>
                    <span id="idPerfil">-</span>
                </div>

                <div>
                    <strong>Nome</strong>
                    <span id="nomePerfilInfo">-</span>
                </div>

                <div>
                    <strong>Email</strong>
                    <span id="emailPerfilInfo">-</span>
                </div>
            </div>

            <button class="btn-sair" onclick="sairSistema()">Sair do sistema</button>
        </div>
