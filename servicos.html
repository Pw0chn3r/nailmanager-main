<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NailManager - Serviços</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- MENU LATERAL -->
    <aside class="sidebar" id="sidebar">
        <div>
            <div class="toggle-btn" onclick="toggleMenu()">☰</div>
            <button class="btn-tema" onclick="alternarTema()">
                🌙
            </button>

            <div class="logo">
                <span class="logo-text">💅NailManager</span>
            </div>

            <nav>
                <ul>
                    <li><a href="dashboard.html">🏠 <span class="menu-text">Dashboard</span></a></li>
                    <li><a href="agenda.html">📅 <span class="menu-text">Agenda</span></a></li>
                    <li><a href="index.html">👤 <span class="menu-text">Clientes</span></a></li>
                    <li><a href="profissionais.html">🧑‍🔧 <span class="menu-text">Profissionais</span></a></li>
                    <li class="ativo"><a href="servicos.html">💅 <span class="menu-text">Serviços</span></a></li>
                    <li><a href="estoque.html">📦 <span class="menu-text">Estoque</span></a></li>
                    <li><a href="financeiro.html">💰 <span class="menu-text">Financeiro</span></a></li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- CONTEÚDO -->
    <main class="conteudo">
        <div class="topo-servicos">
            <h2>Serviços <span id="totalServicos">0</span></h2>

            <div class="acoes-topo">
                <input type="text" id="busca" placeholder="Buscar serviço..." onkeyup="buscarServico()">
                <button onclick="abrirFormulario()">+ Adicionar Serviço</button>
            </div>
        </div>

        <div class="card-tabela">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Comissão</th>
                        <th>Duração</th>
                        <th>Status</th>
                        <th>Descrição</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaServicos"></tbody>
            </table>
        </div>
    </main>

    <!-- PAINEL DIREITO -->
    <aside class="painel-direito" id="painelDireito">
        <div class="header-painel">
            <h3>Novo Serviço</h3>
            <span onclick="fecharFormulario()">✖</span>
        </div>

        <form id="formServico" onsubmit="cadastrarServico(event)">
            <input type="text" id="nome" placeholder="Nome do serviço" required>
            <input type="number" id="preco" placeholder="Preço" step="0.01" required>
            <input type="number" id="comissao" placeholder="Comissão da profissional (%)" step="0.01" required>
            <input type="number" id="duracao" placeholder="Duração em minutos" required>
            <input type="text" id="categoria" placeholder="Categoria" required>
            <textarea id="descricao" placeholder="Descrição do serviço"></textarea>

            <select id="status" required>
                <option value="">Selecione o status</option>
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
            </select>

            <button type="submit">Salvar Serviço</button>
        </form>
    </aside>

</div>

<div class="modal-confirmacao" id="modalConfirmacao">
    <div class="modal-caixa">
        <h3>Confirmar exclusão</h3>
        <p id="modalMensagem">Deseja realmente excluir?</p>

        <div class="modal-botoes">
            <button class="btn-cancelar-modal" onclick="fecharModal()">Cancelar</button>
            <button class="btn-confirmar-modal" id="btnConfirmarModal">Excluir</button>
        </div>
    </div>
</div>

<script src="servicos.js"></script>
</body>
</html>
